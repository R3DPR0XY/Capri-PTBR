<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
  <title>Capri</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="titlebar">
    <div class="wordmark" id="wordmark">CAPRI</div>
    <span class="spacer"></span>
    <span class="status-pill" id="connChip" data-state="disconnected"><span class="dot"></span><span id="connText">Offline</span></span>
    <span id="phaseChip" data-phase="idle"><span id="phaseText">pronta</span></span>
    <button class="win-btn" id="closeBtn" aria-label="Fechar"></button>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" role="tablist" aria-label="Seções"></nav>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="panel.js"></script>
</body>
</html>
